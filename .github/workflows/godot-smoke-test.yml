name: Godot smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  headless-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          ln -sf "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Run main scene for 300 frames
        run: godot --headless --path . --quit-after 300

      - name: Run vertical-slice gameplay checks
        run: godot --headless --path . --script res://tests/test_vertical_slice.gd

      - name: Run tactical combat regression checks
        run: godot --headless --path . --script res://tests/test_tactical_combat.gd

      - name: Run tactical minimap regression checks
        run: godot --headless --path . --script res://tests/test_tactical_minimap.gd

      - name: Run sound-awareness regression checks
        run: godot --headless --path . --script res://tests/test_sound_awareness.gd

      - name: Run footstep audio regression checks
        run: godot --headless --path . --script res://tests/test_footstep_audio.gd

      - name: Run grenade evasion regression checks
        run: godot --headless --path . --script res://tests/test_grenade_evasion.gd

      - name: Run enemy patrol regression checks
        run: godot --headless --path . --script res://tests/test_enemy_patrol.gd

      - name: Run enemy survival regression checks
        run: godot --headless --path . --script res://tests/test_enemy_survival.gd

      - name: Run shot tracer regression checks
        run: godot --headless --path . --script res://tests/test_shot_tracers.gd

      - name: Run difficulty-balance regression checks
        run: godot --headless --path . --script res://tests/test_difficulty.gd

      - name: Run road marking regression checks
        run: godot --headless --path . --script res://tests/test_road_markings.gd

      - name: Run reload animation regression checks
        run: godot --headless --path . --script res://tests/test_reload_animation.gd

      - name: Run procedural character animation regression checks
        run: godot --headless --path . --script res://tests/test_character_animation.gd

      - name: Run weapon impact regression checks
        run: godot --headless --path . --script res://tests/test_weapon_impacts.gd

      - name: Run tactical lean regression checks
        run: godot --headless --path . --script res://tests/test_tactical_lean.gd
